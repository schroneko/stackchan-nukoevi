version: 2
updates:
- package-ecosystem: npm
  directories:
  - /
  - /channels/stackchan
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Tokyo
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  open-pull-requests-limit: 5
- package-ecosystem: gomod
  directory: /server
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Tokyo
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  open-pull-requests-limit: 5
- package-ecosystem: docker
  directory: /server/manifest/docker
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Tokyo
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  open-pull-requests-limit: 5
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Tokyo
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  open-pull-requests-limit: 5
